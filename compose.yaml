services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-futebol_amigos}
      MYSQL_USER: ${DB_USER:-futebol}
      MYSQL_PASSWORD: ${DB_PASSWORD:-futebol}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-futebol_amigos}
      DB_USER: ${DB_USER:-futebol}
      DB_PASSWORD: ${DB_PASSWORD:-futebol}
      ADMIN_NOME: ${ADMIN_NOME:-Administrador}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@futebolamigos.local}
      ADMIN_SENHA: ${ADMIN_SENHA:-}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

volumes:
  mysql_data:
