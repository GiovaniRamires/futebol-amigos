services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-futebol_amigos}
      POSTGRES_USER: ${DB_USER:-futebol}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-futebol}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-futebol} -d ${DB_NAME:-futebol_amigos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-futebol_amigos}
      DB_USER: ${DB_USER:-futebol}
      DB_PASSWORD: ${DB_PASSWORD:-futebol}
      ADMIN_NOME: ${ADMIN_NOME:-Administrador}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@futebolamigos.local}
      ADMIN_SENHA: ${ADMIN_SENHA:-}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

volumes:
  postgres_data:
