<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Proxima partida</title></head>
<body>
<div layout:fragment="conteudo">
    <h1 class="h4 mb-3">Proxima partida</h1>

    <div th:if="${partida == null}" class="alert alert-info">Nenhuma partida futura agendada no momento.</div>

    <div th:if="${partida != null}" class="card card-body bg-white mb-4">
        <h2 class="h6" th:text="${partida.local}"></h2>
        <p class="mb-2" th:text="${#temporals.format(partida.dataHora, 'dd/MM/yyyy HH:mm')}"></p>
        <p class="mb-3">Valor da diaria: <strong th:text="${'R$ ' + #numbers.formatDecimal(partida.valorDiaria, 1, 2)}"></strong></p>

        <div class="d-flex gap-2">
            <form th:action="@{/jogador/partidas/{id}/confirmar(id=${partida.id})}" method="post">
                <button type="submit" class="btn btn-success btn-sm">Confirmar presenca</button>
            </form>
            <form th:action="@{/jogador/partidas/{id}/cancelar(id=${partida.id})}" method="post">
                <button type="submit" class="btn btn-outline-danger btn-sm">Cancelar presenca</button>
            </form>
        </div>
    </div>

    <div th:if="${sorteio != null}" class="card card-body bg-white">
        <h2 class="h6 mb-3">Times publicados</h2>
        <div class="row">
            <div class="col-6" th:each="time : ${sorteio.times}">
                <strong th:text="${time.nome}"></strong>
                <ul class="mb-0">
                    <li th:each="p : ${time.participacoes}" th:text="${p.usuario.nome}"></li>
                </ul>
            </div>
        </div>
    </div>
</div>
</body>
</html>
