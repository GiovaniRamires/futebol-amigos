<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title layout:title-pattern="$CONTENT_TITLE - Futebol Amigos" th:remove="tag">Futebol Amigos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body { background-color: #f4f6f8; }
        .navbar-brand { font-weight: 600; }
        footer { color: #888; font-size: 0.85rem; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark" th:if="${#httpServletRequest.userPrincipal != null}" sec:authorize="isAuthenticated()">
    <div class="container">
        <a class="navbar-brand" th:href="@{/painel}">⚽ Futebol Amigos</a>
        <div class="d-flex align-items-center">
            <span class="text-light me-3 small" sec:authentication="name"></span>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-sm btn-outline-light">Sair</button>
            </form>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div layout:fragment="conteudo"></div>
</main>

<footer class="container text-center py-3">
    Projeto de demonstracao desenvolvido com apoio de agentes de IA (Kiro Crew).
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDwLof7w2DNfMZvC7CqJy6xcT8d" crossorigin="anonymous"></script>
</body>
</html>
