<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Jogadores</title></head>
<body>
<div layout:fragment="conteudo">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">Jogadores</h1>
        <a th:href="@{/admin/jogadores/novo}" class="btn btn-primary btn-sm">+ Novo jogador</a>
    </div>

    <div class="table-responsive">
        <table class="table table-sm align-middle bg-white">
            <thead>
            <tr>
                <th>Nome</th>
                <th>E-mail</th>
                <th>Perfil</th>
                <th>Tipo</th>
                <th>Status</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="j : ${jogadores}">
                <td th:text="${j.nome}"></td>
                <td th:text="${j.email}"></td>
                <td th:text="${j.perfil}"></td>
                <td th:text="${j.tipoJogador}"></td>
                <td>
                    <span th:if="${j.ativo}" class="badge bg-success">Ativo</span>
                    <span th:unless="${j.ativo}" class="badge bg-secondary">Inativo</span>
                </td>
                <td class="text-end">
                    <a th:href="@{/admin/jogadores/{id}/editar(id=${j.id})}" class="btn btn-sm btn-outline-secondary">Editar</a>
                    <form th:if="${j.ativo}" th:action="@{/admin/jogadores/{id}/desativar(id=${j.id})}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Desativar</button>
                    </form>
                    <form th:unless="${j.ativo}" th:action="@{/admin/jogadores/{id}/ativar(id=${j.id})}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-sm btn-outline-success">Ativar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
