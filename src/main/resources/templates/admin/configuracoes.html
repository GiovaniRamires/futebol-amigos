<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Configuracoes</title></head>
<body>
<div layout:fragment="conteudo">
    <h1 class="h4 mb-3">Configuracoes financeiras</h1>

    <form th:action="@{/admin/configuracoes}" th:object="${form}" method="post" class="card card-body bg-white" style="max-width: 480px;">
        <div class="mb-3">
            <label class="form-label">Valor da mensalidade (R$)</label>
            <input type="number" step="0.01" min="0.01" class="form-control" th:field="*{valorMensalidade}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Dia de vencimento (1-28)</label>
            <input type="number" min="1" max="28" class="form-control" th:field="*{diaVencimentoMensalidade}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Chave Pix</label>
            <input type="text" class="form-control" th:field="*{chavePix}">
        </div>
        <div class="mb-3">
            <label class="form-label">Nome do beneficiario</label>
            <input type="text" class="form-control" th:field="*{nomeBeneficiarioPix}">
        </div>
        <div class="mb-3">
            <label class="form-label">Instrucoes de pagamento</label>
            <textarea class="form-control" th:field="*{instrucoesPagamento}" rows="3"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Salvar</button>
    </form>

    <div class="card card-body bg-white mt-4" style="max-width: 480px;">
        <h2 class="h6 mb-2">Link de autocadastro</h2>
        <p class="text-muted small mb-2">
            Compartilhe este link no grupo para que novos jogadores se cadastrem
            sozinhos (entram como avulsos ativos; voce promove a mensalista depois,
            se for o caso).
        </p>
        <div class="input-group mb-2">
            <input type="text" class="form-control form-control-sm" th:value="${linkCadastro}" id="linkCadastro" readonly>
            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="copiarLinkCadastro()">Copiar</button>
        </div>
        <form th:action="@{/admin/configuracoes/link-cadastro/regenerar}" method="post">
            <button type="submit" class="btn btn-outline-danger btn-sm"
                    onclick="return confirm('O link atual deixara de funcionar. Continuar?');">
                Gerar novo link (revoga o atual)
            </button>
        </form>
    </div>

    <script th:inline="none">
        function copiarLinkCadastro() {
            var campo = document.getElementById('linkCadastro');
            campo.select();
            navigator.clipboard.writeText(campo.value);
        }
    </script>
</div>
</body>
</html>
