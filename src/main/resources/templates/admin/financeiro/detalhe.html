<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Cobranca</title></head>
<body>
<div layout:fragment="conteudo">
    <h1 class="h4 mb-1" th:text="${cobranca.usuario.nome}"></h1>
    <p class="text-muted mb-3">
        <span th:text="${cobranca.tipo}"></span> -
        competencia <span th:text="${cobranca.competencia}"></span> -
        vencimento <span th:text="${#temporals.format(cobranca.vencimento, 'dd/MM/yyyy')}"></span>
    </p>

    <div class="row g-4">
        <div class="col-md-6">
            <div class="card card-body bg-white mb-3">
                <p class="mb-1">Valor total: <strong th:text="${'R$ ' + #numbers.formatDecimal(cobranca.valor, 1, 2)}"></strong></p>
                <p class="mb-1">Saldo pendente: <strong th:text="${'R$ ' + #numbers.formatDecimal(saldoPendente, 1, 2)}"></strong></p>
                <p class="mb-0">Status: <span th:text="${cobranca.status}"></span></p>
            </div>

            <a th:if="${linkWhatsApp != null}" th:href="${linkWhatsApp}" target="_blank" class="btn btn-success btn-sm">
                Preparar cobranca no WhatsApp
            </a>
            <p th:if="${linkWhatsApp == null}" class="text-muted small">
                Jogador sem telefone cadastrado - nao e possivel montar o link do WhatsApp.
            </p>

            <h2 class="h6 mt-4">Historico de pagamentos</h2>
            <table class="table table-sm bg-white">
                <thead><tr><th>Data</th><th>Valor</th><th>Metodo</th><th>Registrado por</th></tr></thead>
                <tbody>
                <tr th:each="p : ${pagamentos}">
                    <td th:text="${#temporals.format(p.dataPagamento, 'dd/MM/yyyy')}"></td>
                    <td th:text="${'R$ ' + #numbers.formatDecimal(p.valor, 1, 2)}"></td>
                    <td th:text="${p.metodo}"></td>
                    <td th:text="${p.registradoPor.nome}"></td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="col-md-6">
            <h2 class="h6">Registrar pagamento</h2>
            <form th:action="@{/admin/financeiro/{id}/pagamentos(id=${cobranca.id})}" th:object="${form}" method="post" class="card card-body bg-white">
                <div class="mb-3">
                    <label class="form-label">Valor pago (R$)</label>
                    <input type="number" step="0.01" min="0.01" class="form-control" th:field="*{valor}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Data do pagamento</label>
                    <input type="date" class="form-control" th:field="*{dataPagamento}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Metodo</label>
                    <select class="form-select" th:field="*{metodo}">
                        <option value="PIX">Pix</option>
                        <option value="DINHEIRO">Dinheiro</option>
                        <option value="OUTRO">Outro</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Registrar pagamento</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
