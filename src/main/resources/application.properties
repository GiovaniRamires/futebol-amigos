spring.application.name=futebol-amigos

# Datasource (PostgreSQL) - sobrescrito por variaveis de ambiente em producao
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:futebol_amigos}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Thymeleaf
spring.thymeleaf.cache=false

# Administrador inicial (criado no primeiro start se nao existir nenhum ADMINISTRADOR)
app.admin.nome=${ADMIN_NOME:Administrador}
app.admin.email=${ADMIN_EMAIL:admin@futebolamigos.local}
app.admin.senha=${ADMIN_SENHA:}

# Configuracao padrao do sistema (usada apenas na migration de seed)
app.futebol.limite-padrao-participantes=${LIMITE_PADRAO_PARTICIPANTES:20}

server.port=${PORT:${SERVER_PORT:8080}}

management.endpoints.web.exposure.include=health,info
