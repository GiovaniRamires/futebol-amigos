# Perfil de testes: usa H2 em modo de compatibilidade PostgreSQL, pois o ambiente
# de execucao dos agentes nao tem Docker/PostgreSQL disponivel para Testcontainers.
# Em producao, a aplicacao roda contra PostgreSQL real (ver application.properties).
# Ver docs/DECISIONS.md (ADR sobre ambiente de testes) e README (limitacoes conhecidas).

spring.datasource.url=jdbc:h2:mem:futebol_amigos;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.admin.nome=Administrador Teste
app.admin.email=admin@teste.local
app.admin.senha=admin123teste
